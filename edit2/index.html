<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"kicker","type":"string","label":"Kicker","default":"PROJEK PERUMAHAN BARU"},
    {"id":"title","type":"string","label":"Tajuk","default":"Rumah Berkembar 1-Tingkat"},
    {"id":"location","type":"string","label":"Lokasi","default":"Persiaran Masjid Sultan, Pulau Indah"},
    {"id":"priceFrom","type":"string","label":"Harga dari","default":"RM385,000"},
    {"id":"accent","type":"color","label":"Highlighter","default":"#FFD84D"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f4efe4;
        --ink: #161616;
        --muted: #6b675e;
        --accent: #ffd84d;
        --m: 72px; /* grid margin */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }

      #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 1; transform-origin: 50% 45%; }
      #cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

      .scene-host { position: absolute; inset: 0; }

      /* photo card shown on the location page */
      #photo-card {
        position: absolute; left: 556px; top: 1010px; width: 452px; height: 790px; z-index: 12;
        background: #fff; padding: 16px; box-shadow: 0 18px 44px rgba(0,0,0,.25);
        transform-origin: 50% 50%;
      }
      #photo-card-inner { position: absolute; left: 16px; top: 16px; right: 16px; bottom: 16px; overflow: hidden; }
      #photo-card video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }

      /* yellow wipe used on two cuts */
      #wipe {
        position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 30;
        background: var(--accent); border-left: 14px solid var(--ink); border-right: 14px solid var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34.4" data-width="1080" data-height="1920">

      <!-- ============ FOOTAGE (all muted; voice runs on its own track for J/L cuts) ============ -->
      <div id="cam">
        <!-- HOOK: finished houses, slowed -->
        <video id="v-hook" class="clip" src="assets/footage.mp4" muted playsinline
          data-start="0" data-duration="3.6" data-media-start="15.9" data-playback-rate="0.6" data-track-index="1"></video>
        <!-- TALK: "sekarang ni saya di projek perumahan" -->
        <video id="v-s1" class="clip" src="assets/footage.mp4" muted playsinline
          data-start="3.6" data-duration="2.82" data-media-start="4.98" data-track-index="1"></video>
        <!-- TALK: "kita tengok rumah dia" -->
        <video id="v-s3" class="clip" src="assets/footage.mp4" muted playsinline
          data-start="6.42" data-duration="1.4" data-media-start="12.05" data-track-index="1"></video>
        <!-- UNITS: pan across finished houses -->
        <video id="v-units" class="clip" src="assets/footage.mp4" muted playsinline
          data-start="12.1" data-duration="4.6" data-media-start="13.35" data-playback-rate="0.55" data-track-index="1"></video>
        <!-- PAKEJ: continuing pan -->
        <video id="v-pakej" class="clip" src="assets/footage.mp4" muted playsinline
          data-start="16.7" data-duration="4.8" data-media-start="17.5" data-playback-rate="0.5" data-track-index="1"></video>
        <!-- SIAP: row still under construction -->
        <video id="v-siap" class="clip" src="assets/footage.mp4" muted playsinline
          data-start="21.5" data-duration="2.8" data-media-start="0.1" data-track-index="1"></video>
        <!-- END: hero shot again (bookend) -->
        <video id="v-end" class="clip" src="assets/footage.mp4" muted playsinline
          data-start="29.45" data-duration="4.95" data-media-start="15.9" data-playback-rate="0.43" data-track-index="1"></video>
      </div>

      <!-- ============ GRAPHICS ============ -->
      <div id="hook" class="scene-host" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="plan" class="scene-host" data-composition-id="plan" data-composition-src="compositions/plan.html"
        data-start="7.46" data-duration="4.94" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:6"></div>
      <div id="units" class="scene-host" data-composition-id="units" data-composition-src="compositions/units.html"
        data-start="12.2" data-duration="4.6" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="pakej" class="scene-host" data-composition-id="pakej" data-composition-src="compositions/pakej.html"
        data-start="16.7" data-duration="4.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="siap" class="scene-host" data-composition-id="siap" data-composition-src="compositions/siap.html"
        data-start="21.5" data-duration="2.95" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="lokasi" class="scene-host" data-composition-id="lokasi" data-composition-src="compositions/lokasi.html"
        data-start="24.12" data-duration="5.48" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="end" class="scene-host" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="29.6" data-duration="4.8" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="captions" class="scene-host" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="3.6" data-duration="4.02" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:8"></div>

      <!-- photo card on the location page (moves with that page) -->
      <div id="photo-card">
        <div id="photo-card-inner">
          <video id="v-card" class="clip" src="assets/footage.mp4" muted playsinline
            data-start="24.12" data-duration="5.48" data-media-start="13.5" data-playback-rate="0.45" data-track-index="5"></video>
        </div>
      </div>

      <div id="wipe"></div>

      <!-- ============ VOICE ============ -->
      <audio id="a-s2" class="clip" src="assets/voice.m4a" data-start="0.26" data-duration="2.17" data-media-start="8.28" data-volume="1" data-fade-in="0.03" data-fade-out="0.04" data-track-index="8"></audio>
      <audio id="a-s1" class="clip" src="assets/voice.m4a" data-start="3.6" data-duration="2.82" data-media-start="4.98" data-volume="1" data-fade-in="0.03" data-fade-out="0.03" data-track-index="8"></audio>
      <audio id="a-s3" class="clip" src="assets/voice.m4a" data-start="6.42" data-duration="1.2" data-media-start="12.05" data-volume="1" data-fade-in="0.03" data-fade-out="0.06" data-track-index="8"></audio>

      <!-- ============ SFX (each one has a cause on screen) ============ -->
      <audio id="sfx-hook" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="1.4" data-volume="0.2" data-fade-out="0.6" data-track-index="10"></audio>
      <audio id="sfx-hook-price" class="clip" src="assets/sfx/pop.mp3" data-start="0.41" data-duration="0.4" data-volume="0.7" data-track-index="11"></audio>
      <audio id="sfx-hook-loc" class="clip" src="assets/sfx/click-soft.mp3" data-start="1.5" data-duration="0.35" data-volume="0.8" data-track-index="12"></audio>
      <audio id="sfx-wipe1" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.47" data-duration="0.5" data-volume="0.6" data-track-index="13"></audio>
      <audio id="sfx-plan-in" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="7.2" data-duration="0.8" data-media-start="2.2" data-volume="0.28" data-fade-out="0.4" data-track-index="13"></audio>
      <audio id="sfx-bed1" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.67" data-duration="0.3" data-volume="0.55" data-track-index="11"></audio>
      <audio id="sfx-bed2" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.87" data-duration="0.3" data-volume="0.65" data-track-index="12"></audio>
      <audio id="sfx-bed3" class="clip" src="assets/sfx/click-soft.mp3" data-start="9.07" data-duration="0.3" data-volume="0.75" data-track-index="11"></audio>
      <audio id="sfx-bed4" class="clip" src="assets/sfx/click-soft.mp3" data-start="9.27" data-duration="0.3" data-volume="0.85" data-track-index="12"></audio>
      <audio id="sfx-bath" class="clip" src="assets/sfx/pop.mp3" data-start="9.52" data-duration="0.4" data-volume="0.6" data-track-index="11"></audio>
      <audio id="sfx-plan-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="12.17" data-duration="0.5" data-volume="0.5" data-track-index="13"></audio>
      <audio id="sfx-units-price" class="clip" src="assets/sfx/pop.mp3" data-start="13.56" data-duration="0.4" data-volume="0.7" data-track-index="11"></audio>
      <audio id="sfx-pakej-1" class="clip" src="assets/sfx/click-soft.mp3" data-start="16.96" data-duration="0.3" data-volume="0.8" data-track-index="12"></audio>
      <audio id="sfx-pakej-2" class="clip" src="assets/sfx/pop.mp3" data-start="17.16" data-duration="0.4" data-volume="0.55" data-track-index="11"></audio>
      <audio id="sfx-pakej-3" class="clip" src="assets/sfx/click-soft.mp3" data-start="17.5" data-duration="0.3" data-volume="0.9" data-track-index="12"></audio>
      <audio id="sfx-wipe2" class="clip" src="assets/sfx/whoosh.mp3" data-start="21.37" data-duration="0.5" data-volume="0.6" data-track-index="13"></audio>
      <audio id="sfx-siap" class="clip" src="assets/sfx/pop.mp3" data-start="21.86" data-duration="0.4" data-volume="0.7" data-track-index="11"></audio>
      <audio id="sfx-lokasi-in" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="23.86" data-duration="0.8" data-media-start="2.2" data-volume="0.28" data-fade-out="0.4" data-track-index="13"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="28.16" data-duration="2.0" data-media-start="1.5" data-volume="0.13" data-fade-in="0.6" data-track-index="10"></audio>
      <audio id="sfx-lokasi-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="29.47" data-duration="0.5" data-volume="0.5" data-track-index="13"></audio>
      <audio id="sfx-end-price" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="30.06" data-duration="2.0" data-volume="0.3" data-fade-out="0.8" data-track-index="14"></audio>
      <audio id="sfx-end-hi" class="clip" src="assets/sfx/sparkle.mp3" data-start="30.2" data-duration="1.2" data-volume="0.12" data-fade-out="0.5" data-track-index="12"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // camera: punch on "projek perumahan", reset on the next sentence
      tl.set("#cam", { scale: 1, x: 0, y: 0 }, 0);
      tl.set("#cam", { scale: 1.1, y: 30 }, 4.82);
      tl.set("#cam", { scale: 1, y: 0 }, 6.42);

      // yellow wipe: covers the frame exactly on the cut, then leaves the other side
      tl.set("#wipe", { x: 1100 }, 0);
      tl.to("#wipe", { x: 0, duration: 0.18, ease: "power3.in" }, 3.42);
      tl.to("#wipe", { x: -1100, duration: 0.24, ease: "power3.out" }, 3.6);
      tl.to("#wipe", { x: 0, duration: 0.18, ease: "power3.in" }, 21.32);
      tl.to("#wipe", { x: -1100, duration: 0.24, ease: "power3.out" }, 21.5);

      // photo card rides with the location page (slide in 24.12, slide out 29.3)
      tl.set("#photo-card", { y: 1920, rotation: 3, opacity: 1 }, 0);
      tl.to("#photo-card", { y: 0, duration: 0.55, ease: "expo.out" }, 24.18);
      tl.to("#photo-card", { y: -1920, duration: 0.3, ease: "power3.in" }, 29.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
