        <path d="M52 128C52 128 6 78 6 48a46 46 0 0 1 92 0c0 30-46 80-46 80z" fill="url(#lc-g)" stroke="#ffffff" stroke-width="5" />

  <script>
    const tl = gsap.timeline({ paused: true });
    // ---- the map camera, same curve as scripts/rafflesia6/bake_map.cjs (map.json) ----
    const CAM = { zstart: 11.3, zend: 12.85, hold: 1.1, drift: 0.12, dur: 9.5, cx: 540, cy: 960 };
    // pixel offsets from the frame centre at zoom zend (scripts/rafflesia6/map_coords.json)
    const POI = { site: [-108.2, -217.9], qs: [-52.8, -61.6], bsp: [228.5, -13.1], kk: [-231.2, -566.7] };
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const zoomAt = (t) => t <= CAM.hold ? CAM.zstart + (CAM.zend - CAM.zstart) * ease(Math.max(0, t / CAM.hold))
      : CAM.zend + CAM.drift * (t - CAM.hold) / (CAM.dur - CAM.hold);
    const at = (id, t) => { const s = Math.pow(2, zoomAt(t) - CAM.zend); return [CAM.cx + POI[id][0] * s, CAM.cy + POI[id][1] * s]; };
    // each line grows from the site to its place when the place is named (power2.out over 0.45 s)
    const LINE_AT = { qs: 0.31, bsp: 1.38, kk: 2.45 };
    const reachAt = (id, t) => { const x = Math.min(1, Math.max(0, (t - LINE_AT[id]) / 0.45)); return 1 - (1 - x) * (1 - x); };
    const cam = { t: 0 };
    const place = () => {
      const t = cam.t;
      const S = at("site", t);
      gsap.set("#lc-at-site", { x: S[0], y: S[1] });
      for (const id of ["qs", "bsp", "kk"]) {
        const P = at(id, t);
        gsap.set("#lc-at-" + id, { x: P[0], y: P[1] });
        const r = reachAt(id, t);
        const ln = document.getElementById("lc-l-" + id);
        ln.setAttribute("x1", S[0].toFixed(1)); ln.setAttribute("y1", S[1].toFixed(1));
        ln.setAttribute("x2", (S[0] + (P[0] - S[0]) * r).toFixed(1)); ln.setAttribute("y2", (S[1] + (P[1] - S[1]) * r).toFixed(1));
      }
    };
    tl.fromTo(cam, { t: 0 }, { t: CAM.dur, duration: CAM.dur, ease: "none", onUpdate: place }, 0);

    // ---- the site: pin drops in while the camera dives, then pulses ----
    tl.fromTo("#lc-k", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.05);
    tl.fromTo("#lc-pin", { opacity: 0, y: -90, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "bounce.out" }, 0.1);
    tl.fromTo("#lc-site-card", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.5);
    // a sonar pulse every 1.25 s (each ring fades out before the next starts)
    tl.fromTo("#lc-pulse", { scale: 0.4, opacity: 0.85 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 0.6);
    tl.fromTo("#lc-pulse2", { scale: 0.4, opacity: 0.6 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 0.95);
    tl.fromTo("#lc-pulse", { scale: 0.4, opacity: 0.85 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 1.85);
    tl.fromTo("#lc-pulse2", { scale: 0.4, opacity: 0.6 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 2.2);
    tl.fromTo("#lc-pulse", { scale: 0.4, opacity: 0.85 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 3.1);
    tl.fromTo("#lc-pulse2", { scale: 0.4, opacity: 0.6 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 3.45);
    tl.fromTo("#lc-pulse", { scale: 0.4, opacity: 0.85 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 4.35);
    tl.fromTo("#lc-pulse2", { scale: 0.4, opacity: 0.6 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 4.7);
    tl.fromTo("#lc-pulse", { scale: 0.4, opacity: 0.85 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 5.6);
    tl.fromTo("#lc-pulse2", { scale: 0.4, opacity: 0.6 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 5.95);
    tl.fromTo("#lc-pulse", { scale: 0.4, opacity: 0.85 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 6.85);
    tl.fromTo("#lc-pulse2", { scale: 0.4, opacity: 0.6 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 7.2);
    tl.fromTo("#lc-pulse", { scale: 0.4, opacity: 0.85 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 8.1);
    tl.fromTo("#lc-pulse2", { scale: 0.4, opacity: 0.6 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, 8.45);

    // ---- "Dekat Quayside Mall Rimbayu, Saujana Putra dan Kota Kemuning." ----
    const poi = (id, t) => {
      tl.fromTo("#lc-" + id + "-dot", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, t + 0.25);
      tl.fromTo("#lc-" + id + "-lab", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.38, ease: "back.out(2)" }, t + 0.3);
    };
    poi("qs", 0.41);
    poi("bsp", 1.48);
    poi("kk", 2.55);

    // ---- "Akses mudah ke Elite, SKVE, Kesas dan LKSA." ----
    const sign = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 30, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(2)" }, t);
    sign("#lc-h1", 4.95);
    sign("#lc-h2", 5.6);
    sign("#lc-h3", 7.02);
    sign("#lc-h4", 7.96);
    tl.fromTo("#lc-credit", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.2);

    // out before the wipe
    const all = ["#lc-k", "#lc-signs", "#lc-lines", "#lc-at-qs", "#lc-at-bsp", "#lc-at-kk", "#lc-at-site", "#lc-credit"];
    tl.to(all, { opacity: 0, duration: 0.2, ease: "power2.in" }, 9.22);
    tl.set(all, { visibility: "hidden" }, 9.48);
    window.__timelines["g-loc"] = tl;
  </script>
